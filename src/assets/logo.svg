<svg
  width="200"
  height="100"
  viewBox="0 0 90 90"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Gradiente stile logo -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="260" y2="0">
      <stop offset="0%" stop-color="#ffecc5"/>
      <stop offset="40%" stop-color="#f7c96b"/>
      <stop offset="100%" stop-color="#f4a13a"/>
    </linearGradient>

    <!-- Glow blu/violaceo -->
    <filter id="titleGlow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feColorMatrix
        in="blur"
        type="matrix"
        values="
          0 0 0 0 0.3
          0 0 0 0 0.5
          0 0 0 0 0.9
          0 0 0 0.7 0"
        result="glowColor"
      />
      <feMerge>
        <feMergeNode in="glowColor"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- RIGA 1 -->
  <text
    x="-22"
    y="32"
    fill="url(#titleGrad)"
    stroke="#fff8dd"
    stroke-width="1"
    paint-order="stroke"
    filter="url(#titleGlow)"
    style="
      font-family: 'Noto Sans KR', system-ui, -apple-system, BlinkMacSystemFont,
                   'Segoe UI', sans-serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 3px;
      text-align: center;
    "
  >
    나 혼자만
  </text>

  <!-- RIGA 2, leggermente spostata -->
  <text
    x="0"
    y="58"
    fill="url(#titleGrad)"
    stroke="#fff8dd"
    stroke-width="1"
    paint-order="stroke"
    filter="url(#titleGlow)"
    style="
      font-family: 'Noto Sans KR', system-ui, -apple-system, BlinkMacSystemFont,
                   'Segoe UI', sans-serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 3px;
      text-align: center;
    "
  >
    레벨업
  </text>
</svg>